name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

# the tests make no remote requests (they are mocked); the live tests run in ci-slow.yaml
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 'queue: max' ensures old runs finish in order instead of being canceled
  queue: max

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        python-version: [
          '3.9', '3.10', '3.11', '3.12', '3.13', '3.14'
        ]
        os: [ubuntu-latest]
        EXTRA: [false]  # used to force includes to get included
        # EXTRA runs should be either the oldest or the newest python.
        include:
          - python-version: '3.9'
            os: ubuntu-22.04  # oldest version on github actions
            EXTRA: true
          - python-version: '3.14'
            os: ubuntu-latest
            env:
              CDXT_LOGLEVEL=DEBUG
            EXTRA: true
          - python-version: '3.14'
            os: macos-latest
            EXTRA: true
          - python-version: '3.14'
            os: windows-latest
            EXTRA: true

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get Runner IP
        run: |
          echo "Runner IP: $(curl -s https://ipinfo.io/ip)"

      - name: Install setuptools on python 3.12+
        # apparently this is a quirk of Github action runners?
        if: ${{ matrix.python-version >= '3.12' }}
        run: |
          pip install setuptools

      - name: Install cdx_toolkit
        run: pip install .[all]

      - name: Set environment variables for faster unit tests (requests are mocked)
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('CDXT_MAX_ERRORS', '2')
            core.exportVariable('CDXT_WARNING_AFTER_N_ERRORS', '2')
            core.exportVariable('CDXT_DEFAULT_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_CC_INDEX_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_CC_DATA_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_IA_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_LOGLEVEL', 'DEBUG')

      - name: Lint code
        run: |
          make lint

      - name: Run tests
        run: |
          make test_coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  unit-tests-minimal:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.14'
            os: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get Runner IP
        run: |
          echo "Runner IP: $(curl -s https://ipinfo.io/ip)"

      - name: Install setuptools on python 3.12+
        if: ${{ matrix.python-version >= '3.12' }}
        run: |
          pip install setuptools

      - name: Install cdx_toolkit (minimal)
        run: pip install .[test]

      - name: Set environment variables for faster unit tests (requests are mocked)
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('CDXT_MAX_ERRORS', '2')
            core.exportVariable('CDXT_WARNING_AFTER_N_ERRORS', '2')
            core.exportVariable('CDXT_DEFAULT_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_CC_INDEX_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_CC_DATA_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_IA_MIN_RETRY_INTERVAL', '0.01')
            core.exportVariable('CDXT_LOGLEVEL', 'DEBUG')

      - name: test minimal
        run: |
          make test
