name: CI-slow

on: workflow_dispatch

# live tests (CDXT_LIVE_TESTS=http,s3,athena,hf): the HTTP requests to the CDX APIs and data.commoncrawl.org, S3,
# Athena and DuckDB against AWS, and the Hugging Face Storage Buckets (HF_TOKEN: writes to
# hf://buckets/commoncrawl/commoncrawl-ci-temp). The permissions are needed to get AWS credentials via GitHub's OIDC
# token endpoint
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # 'queue: max' ensures old runs finish in order instead of being canceled
  queue: max

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - python-version: '3.11'
            os: macos-latest
            EXTRA: true
          - python-version: '3.12'
            os: macos-latest
            EXTRA: true
          - python-version: '3.9'
            os: windows-latest
            EXTRA: true
          - python-version: '3.12'
            os: windows-latest
            EXTRA: true
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install setuptools on python 3.12+
        if: ${{ matrix.python-version >= '3.12' }}
        run: |
          pip install setuptools

      - name: Install cdx_toolkit
        run: pip install ".[all]"

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::837454214164:role/GitHubActions-Role
          aws-region: us-east-1

      - name: Run tests
        env:
          CDXT_LIVE_TESTS: 'http,s3,athena,hf'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          make test_coverage
